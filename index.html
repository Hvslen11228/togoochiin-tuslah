/* Layout: a working kitchen reference. Recipe cards lead with each dish's name in its own script; the recipe view is a prep list beside a method. */
:root{
  --band:#0F4A3E;--band2:#1B6455;--on-band:#EAF7F1;--bg:#EDF2EE;--surface:#FBFDFB;--sunk:#DFE8E2;--fg:#17302A;--muted:#50665F;--line:#C3D2CA;
  --accent:#0B6A58;--on-accent:#F4FFFB;--good:#11734F;--ok:#8A6100;--warn:#B23C25;
  --kr:#B3263F;--mn:#1E58A8;--cn:#C4370F;--us:#32508F;--it:#16764A;--fr:#6A3FA0;--jp:#A81E5C;--wd:#8A5A00;--th:#0B7285;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI","Noto Sans CJK KR","Noto Sans CJK SC","Malgun Gothic","PingFang SC","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --band:#0B2A23;--band2:#16423A;--on-band:#DDF1E8;--bg:#101A17;--surface:#18241F;--sunk:#0B1411;--fg:#E3EEE8;--muted:#9DB2A9;--line:#2F4139;
  --accent:#52CDB0;--on-accent:#06231C;--good:#5FD69F;--ok:#E2B64E;--warn:#F08A72;
  --kr:#F27C90;--mn:#7FB0F2;--cn:#F58E62;--us:#99B2EA;--it:#62CF97;--fr:#BE9CEE;--jp:#F282B4;--wd:#E2B64E;--th:#5CC8DC;color-scheme:dark}}
:root[data-theme="dark"]{
  --band:#0B2A23;--band2:#16423A;--on-band:#DDF1E8;--bg:#101A17;--surface:#18241F;--sunk:#0B1411;--fg:#E3EEE8;--muted:#9DB2A9;--line:#2F4139;
  --accent:#52CDB0;--on-accent:#06231C;--good:#5FD69F;--ok:#E2B64E;--warn:#F08A72;
  --kr:#F27C90;--mn:#7FB0F2;--cn:#F58E62;--us:#99B2EA;--it:#62CF97;--fr:#BE9CEE;--jp:#F282B4;--wd:#E2B64E;--th:#5CC8DC;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--body);font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.brandrow{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:18px 14px}
.brand{font:700 clamp(19px,3.4vw,27px)/1.1 var(--display);letter-spacing:-.02em;margin:0}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;max-width:100%;overflow-x:auto}
.tabs button{padding:7px 13px;border-radius:7px;font-weight:600;font-size:14.5px;white-space:nowrap;color:var(--muted)}
.tabs button[aria-current="true"]{background:var(--surface);color:var(--fg)}
.searchrow{padding-block:0 14px}
#q{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#q::placeholder{color:var(--muted)}
main{padding-block:20px 56px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{--c:var(--fg);padding:6px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:14.5px;font-weight:500;display:flex;gap:7px;align-items:baseline}
.chip small{color:var(--c);font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.chip[aria-pressed="true"] small{color:var(--surface)}
.resultline{color:var(--muted);font-size:14.5px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.card{--c:var(--accent);display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;width:100%;height:100%;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--c);transform:translateY(-2px)}
.cardcell{position:relative}
.native{font-weight:700;font-size:27px;line-height:1.2;color:var(--c);overflow-wrap:anywhere;padding-right:30px}
.cardname{font-weight:600;font-size:16.5px;margin-top:2px}
.carddesc{color:var(--muted);font-size:14.5px;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:13.5px;margin-top:6px}
.miss{font-weight:600;font-size:13.5px}
.card{padding:0;overflow:hidden}.card>:not(.thumb){margin-left:16px;margin-right:16px}.card>.meta{margin-bottom:16px}.card>.native{padding-right:0;margin-top:10px}
.thumb{display:block;aspect-ratio:3/2;background:var(--sunk);max-width:100%}.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.star{background:var(--surface)}
.hero{margin:0 0 18px;max-width:520px}.hero img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:var(--sunk)}.hero figcaption{color:var(--muted);font-size:13px;margin-top:6px}
.star{position:absolute;top:10px;right:10px;width:34px;height:34px;text-align:center;font-size:19px;color:var(--muted);border-radius:6px}
.star[aria-pressed="true"]{color:var(--ok)}
.empty{padding:32px 18px;background:var(--surface);border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.back{font-weight:600;color:var(--accent);margin-bottom:16px;display:inline-block}
.rhead{--c:var(--accent);margin-bottom:22px;max-width:760px;position:relative}
.rhead .native{font-size:clamp(34px,7vw,56px);padding-right:0;line-height:1.1}
.rhead h2{font:700 clamp(18px,3vw,24px)/1.25 var(--display);margin:8px 0 8px;text-wrap:balance}
.rhead p{margin:0;color:var(--muted);max-width:65ch}
.rtools{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.btn{padding:8px 13px;border:1px solid var(--line);border-radius:7px;font-weight:600;font-size:14.5px;background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.panelhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.panel h3{font:700 15px/1.3 var(--display);margin:0}
.stepper{display:flex;align-items:center;gap:8px;font-size:14.5px}
.stepper button{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;text-align:center;font-weight:700}
.stepper b{min-width:62px;text-align:center}
.legend{color:var(--muted);font-size:13px;margin:0 0 8px}
.ingrow{border-top:1px solid var(--line)}
.ingbtn{display:grid;grid-template-columns:minmax(0,1fr) auto 16px;gap:10px;align-items:baseline;width:100%;padding:10px 0}
.ingname{font-weight:600;min-width:0}
.ingname em{display:block;font-style:normal;font-weight:400;color:var(--muted);font-size:13.5px}
.ingamt{font-weight:600;white-space:nowrap;font-size:14.5px}
.chev{color:var(--muted);transition:transform .15s}
.ingbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.swapped{color:var(--accent)}
.detail{padding:2px 0 14px;font-size:14.5px;display:grid;gap:9px}
.detail p{margin:0}
.nat{font-weight:600}
.where{color:var(--muted);font-size:13.5px}
.hard{color:var(--warn);font-weight:500}
.subs{display:grid;gap:7px}
.sub{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:9px 10px;background:var(--bg);border-radius:6px;width:100%;border:1px solid transparent}
.sub[aria-pressed="true"]{border-color:var(--accent)}
.sub strong{font-weight:600}
.sub span.note{grid-column:1/-1;color:var(--muted);font-size:13.5px}
.grade{font-size:12.5px;font-weight:600;white-space:nowrap}
.g3{color:var(--good)}.g2{color:var(--ok)}.g1{color:var(--warn)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 8px;padding:12px 0;border-top:1px solid var(--line)}
.steps li::before{content:counter(s);font:700 15px/1.5 var(--display);color:var(--accent)}
.steps p{margin:0;max-width:62ch}
.timer{grid-column:2;justify-self:start;padding:4px 10px;border:1px solid var(--line);border-radius:6px;font-weight:600;font-size:13.5px}
.timer.run{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.timer.done{border-color:var(--good);color:var(--good)}
.tip{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:14.5px}
.tip b{color:var(--accent)}
.ilist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
@media (max-width:400px){.ilist{grid-template-columns:minmax(0,1fr)}}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:15px;display:grid;gap:9px;font-size:14.5px;min-width:0}
.icard h3{margin:0;font-size:17px;font-weight:700}
.ihead{display:flex;gap:10px;justify-content:space-between;align-items:start}
.have{flex:none;padding:5px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-weight:600}
.have[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.icard p{margin:0}
.subtext{display:grid;gap:5px}
.subtext div{padding:7px 9px;background:var(--bg);border-radius:6px}
.subtext .note{display:block;color:var(--muted);font-size:13.5px}
.used{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13.5px;color:var(--muted)}
.used button{color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.foot{color:var(--muted);font-size:13.5px;margin-top:28px;max-width:70ch}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 15px;border-radius:7px;font-weight:600;font-size:14.5px;max-width:90vw}

/* v2 layout */
header.top{background:var(--band);border-bottom:0;color:var(--on-band)}
.brand{color:var(--on-band)}
.brandsub{margin:4px 0 0;font-size:14px;opacity:.82}
.tabs{background:var(--band2)}.tabs button{color:var(--on-band)}.tabs button[aria-current="true"]{background:var(--surface);color:var(--fg)}
#q{background:var(--band2);border-color:transparent;color:var(--on-band)}#q::placeholder{color:var(--on-band);opacity:.75}
.filterbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.filterbar label{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.filterbar select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font-size:14.5px;font-weight:500}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px}
.searchslot{min-width:0}.resultline{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{border-radius:10px;gap:4px;overflow:hidden}.card>.cardname{order:1;font-size:17.5px;font-weight:700;margin-top:12px;line-height:1.3}
.card>.thumb{order:0;position:relative;overflow:hidden}.thumb img{transition:transform .25s}.card:hover .thumb img{transform:scale(1.04)}
.card>.native{order:2;font-size:15px;font-weight:600;margin-top:0;line-height:1.3}.card>.carddesc{order:3;margin-top:4px}.card>.meta{order:4}
.pill{position:absolute;left:10px;bottom:10px;padding:3px 9px;border-radius:6px;background:var(--surface);color:var(--c);font-size:12.5px;font-weight:700}
.rtop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:26px}
@media (max-width:820px){.rtop{grid-template-columns:minmax(0,1fr);gap:16px}}
.hero,.rhead{margin:0;max-width:none}.hero img{aspect-ratio:3/2;border-radius:10px}
.rhead .native{font-size:clamp(20px,3vw,28px);margin-bottom:2px}.rhead h2{font-size:clamp(23px,3.4vw,34px);margin:2px 0 10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:16px 0 4px}
.stats div{background:var(--surface);padding:9px 10px;min-width:0}.stats dt{font-size:12px;color:var(--muted)}.stats dd{margin:0;font-weight:700;font-size:15px}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.romline{color:var(--muted);font-size:13.5px;margin-top:8px}
.panel{border-radius:10px}
.cook{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;align-items:start}
@media (max-width:860px){.cook{grid-template-columns:minmax(0,1fr)}}
.cookhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:6px}
.cookhead h3{font:700 16px/1.3 var(--display);margin:0}
.count{font-weight:700;color:var(--accent)}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.grp{padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}.grp h4{margin:0 0 8px;font-size:14px;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:5px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:var(--bg);font-weight:500}
.tag[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.note{color:var(--muted);font-size:13px;margin:0}
.ressec{margin-bottom:20px}.ressec h3{font:700 15px/1.3 var(--display);margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.ressec h3 small{font:600 13px var(--body);color:var(--muted)}
.rows{display:grid;gap:8px}
.row{--c:var(--accent);display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;width:100%;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.row:hover{border-color:var(--c)}
.row img{display:block;width:96px;height:72px;object-fit:cover;border-radius:6px;background:var(--sunk)}
.row b{display:block;font-size:15.5px;line-height:1.3}.row .meta{margin-top:2px;font-size:13px}
.row .needs{display:block;font-size:13.5px;margin-top:3px;color:var(--warn);font-weight:500}.row .ready{display:block;font-size:13.5px;margin-top:3px;color:var(--good);font-weight:600}
.occ{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:thin}
.occb{flex:1 0 128px;display:grid;gap:1px;padding:11px 13px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.occb b{font-size:14.5px;font-weight:700;line-height:1.25}.occb small{font-size:12.5px;color:var(--muted)}
.occb:hover{border-color:var(--accent)}.occb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.occb[aria-pressed="true"] small{color:var(--on-accent)}
.occnote{margin:0 0 12px;max-width:70ch;font-size:14.5px;color:var(--muted)}
.occtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.jump{display:none}@media (max-width:860px){.jump{display:inline-block}}

/* v3 modern */
:root{--bg:#F5F6F3;--surface:#FFFFFF;--sunk:#E9EBE6;--fg:#141B18;--muted:#5F6B65;--line:#E1E4DE;--accent:#D93F1B;--on-accent:#FFFFFF;--good:#0E7A4F;--ok:#946200;--warn:#C23B1E;--glass:rgba(245,246,243,.84);--shadow:0 1px 2px rgba(20,27,24,.05),0 8px 24px rgba(20,27,24,.06);--band:#141B18;--band2:#E9EBE6;--on-band:#141B18;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1211;--surface:#181E1B;--sunk:#222A26;--fg:#EEF2EF;--muted:#9BA8A1;--line:#2A322E;--accent:#FF7D5C;--on-accent:#230B04;--good:#5CD6A0;--ok:#E5B94F;--warn:#FF9378;--glass:rgba(14,18,17,.82);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3);--band:#EEF2EF;--band2:#222A26;--on-band:#EEF2EF;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0E1211;--surface:#181E1B;--sunk:#222A26;--fg:#EEF2EF;--muted:#9BA8A1;--line:#2A322E;--accent:#FF7D5C;--on-accent:#230B04;--good:#5CD6A0;--ok:#E5B94F;--warn:#FF9378;--glass:rgba(14,18,17,.82);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3);--band:#EEF2EF;--band2:#222A26;--on-band:#EEF2EF;color-scheme:dark;}
body{font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line);color:var(--fg)}
.brandrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding-block:12px}
.brand{font:700 18px/1.1 var(--display);letter-spacing:-.03em;color:var(--fg);white-space:nowrap}
.brandsub{display:none}
#q{padding:10px 16px;border-radius:999px;border:1px solid transparent;background:var(--sunk);color:var(--fg);font-size:15px;min-width:0}
#q::placeholder{color:var(--muted);opacity:1}#q:focus{background:var(--surface);border-color:var(--accent);outline:none}
.tabs{background:none;padding:0;gap:2px;border-radius:0;overflow:visible}
.tabs button{padding:8px 13px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14.5px}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-current="true"]{background:var(--fg);color:var(--bg)}
main{padding-block:26px 72px}
.hero-home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:center;margin-bottom:34px}
.hero-home h2{font:700 clamp(30px,4.6vw,52px)/1.08 var(--display);letter-spacing:-.04em;margin:0 0 14px;text-wrap:balance}
.hero-home p{margin:0 0 20px;color:var(--muted);font-size:17px;max-width:44ch}
.cta{display:inline-block;padding:13px 22px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700}

document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;
if(d.go){state.showF=false;nav(d.go);return}
if("preset" in d){PRESET.forEach(function(k){if(state.have.indexOf(k)<0)state.have.push(k)});LS.set("tt_have",state.have);render();return}
if("togglef" in d){state.showF=!state.showF;render();return}
if("closef" in d){state.showF=false;render();return}
if(d.clear){if(d.clear==="country")state.country="all";else state.f[d.clear]="all";render();return}
if(d.meal){state.f.meal=d.meal;render();return}
if(d.occ){state.f.occ=state.f.occ===d.occ?"all":d.occ;render();return}
if(d.occgo){state.f.occ=d.occgo;state.q="";document.getElementById("q").value="";nav("recipes");window.scrollTo(0,0);return}
if("jump" in d){var el=document.getElementById("results");if(el)el.scrollIntoView();return}
if("reset" in d){state.country="all";state.f={meal:"all",occ:"all",kind:"all",main:"all",time:"all",diff:"all",sort:state.f.sort};render();return}
if(d.open){state.showF=false;nav("r-"+d.open);return}
if(d.save){var i=state.saved.indexOf(d.save);if(i>=0)state.saved.splice(i,1);else state.saved.push(d.save);LS.set("tt_saved",state.saved);render();return}
if(d.country){state.country=d.country;render();return}
if(d.have){var j=state.have.indexOf(d.have);if(j>=0)state.have.splice(j,1);else state.have.push(d.have);LS.set("tt_have",state.have);render();return}
if("clearhave" in d){state.have=[];LS.set("tt_have",[]);render();return}
if(d.ing){var cur=state.open[state.recipe];var r0=R.filter(function(r){return r.id===state.recipe})[0];if(cur===undefined){var fst=r0.ing.filter(function(x){return ING[x[0]][2]!=="a"})[0]||r0.ing[0];cur=fst[0]}state.open[state.recipe]=cur===d.ing?null:d.ing;render();return}
if(d.swap){var p=d.swap.split(":"),k=p[0],n=+p[1],s=state.swap[state.recipe]||(state.swap[state.recipe]={});if(s[k]===n){delete s[k];toast("Анхны орц руу буцлаа")}else{s[k]=n;toast("Жорт орлуулалт хийлээ")}LS.set("tt_swap",state.swap);render();return}
if(d.serv){var r1=R.filter(function(r){return r.id===state.recipe})[0];var v=(state.serv[r1.id]||r1.serv)+(+d.serv);if(v>=1&&v<=20){state.serv[r1.id]=v;render()}return}
if(d.timer){if(timers[d.timer]){delete timers[d.timer]}else{timers[d.timer]={end:Date.now()+(+d.min)*60000}}refreshTimers();return}
if(d.copy){var r2=R.filter(function(r){return r.id===d.copy})[0];var txt=shopping(r2);var done=function(){toast("Жагсаалт хуулагдлаа")};var fail=function(){toast("Хуулж чадсангүй. Орцын жагсаалтаас гараар хуулна уу.")};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fail)}else{fail()}return}
});
document.getElementById("q").addEventListener("input",function(e){state.q=e.target.value;if(state.view==="recipe"){nav("recipes")}else{render()}});
document.addEventListener("change",function(e){var k=e.target.dataset&&e.target.dataset.fset;if(k){state.f[k]=e.target.value;render();var n=document.getElementById("f-"+k);if(n)n.focus()}});
document.getElementById("brandsub").textContent=R.length+" жор · "+Object.keys(COUNTRIES).length+" ангилал · "+Object.keys(ING).length+" орцын тайлбар";
function trackView(){if(!window.gtag)return;var r=state.view==="recipe"?R.filter(function(x){return x.id===state.recipe})[0]:null;var names={recipes:"Жорууд",cook:"Юу хийх вэ?",pantry:"Орц ба орлуулалт",saved:"Хадгалсан"};gtag("event","page_view",{page_location:location.href,page_path:"/"+(location.hash.slice(1)||"recipes"),page_title:r?r.n:(names[state.view]||"Тогоочийн туслах")})}
window.addEventListener("hashchange",function(){route();trackView()});
route();trackView();
</script>
</body>
</html>
